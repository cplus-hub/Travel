{{ define "main" }}
  <article class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy mid-gray">
    {{ .Content }}
  </article>
  
  <div class="pa3 pa4-ns w-100 w-70-ns center">
    <h2 class="f3 fw4 pa3 mv0">精選行程</h2>
    <section class="w-100 mw8">
      {{/* 這裡改為遍歷 .Site.Sections (資料夾)，而不是 .Site.RegularPages (文章) */}}
      {{ range .Site.Sections }}
        <div class="relative w-100 mb4 bg-white nested-copy-line-height">
          <div class="bg-white mb3 pa4 gray overflow-hidden">
            {{ if .Params.featured_image }}
              <div class="mb3">
                <a href="{{ .RelPermalink }}" class="db grow">
                  <div class="aspect-ratio aspect-ratio--16x9" style="background: url({{ .Params.featured_image }}) no-repeat center center; background-size: cover;"></div>
                </a>
              </div>
            {{ end }}
            <h1 class="f3 near-black">
              <a href="{{ .RelPermalink }}" class="link black dim">
                {{ .Title }}
              </a>
            </h1>
            <div class="nested-links f5 lh-copy nested-copy-line-height">
              {{ .Summary }}
            </div>
            <a href="{{ .RelPermalink }}" class="ba b--moon-gray bg-light-gray br2 color-inherit dib f7 hover-bg-moon-gray link mt2 ph2 pv1">查看行程詳情</a>
          </div>
        </div>
      {{ end }}
    </section>
  </div>
{{ end }}
